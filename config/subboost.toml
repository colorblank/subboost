# Runtime defaults. Override with: subboost --settings /path/subboost.toml ...
# Relative paths resolve against the process working directory. Secrets stay in environment variables.
[application]
database = "data/subboost.sqlite3"
app_url = "http://127.0.0.1:3001"
listen = "127.0.0.1:3002"
local_owner = "local"
sqlite_busy_timeout_seconds = 10

[refresh]
enabled = true
poll_seconds = 60
cache_seconds = 3600
default_interval_seconds = 43200
step_interval_seconds = 360
minimum_interval_seconds = 360
maximum_interval_seconds = 31536000
failure_threshold = 3

[network]
request_timeout_seconds = 15
connect_timeout_seconds = 10
maximum_response_bytes = 10485760
maximum_redirects = 3
maximum_profile_requests = 4
snapshot_comparisons = 100000
negotiation_timeout_seconds = 60
maximum_url_bytes = 8192
user_agents = [
  "v2rayN/7.20.4",
  "mihomo/1.19.24",
  "clash-verge/v2.5.2",
  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
]
github_api_base = "https://api.github.com/repos/MetaCubeX/meta-rules-dat/git/trees"
latest_release_url = "https://api.github.com/repos/SubBoost/subboost/releases/latest"
rule_cache_seconds = 86400
# Used only when system DNS returns Mihomo fake-IP addresses. Results still pass public-IP validation.
doh_url = "https://cloudflare-dns.com/dns-query"
doh_addresses = ["1.1.1.1:443", "1.0.0.1:443"]

[limits]
guest_documents = 100
administrator_documents = 9999
nodes_per_subscription = 10000
import_sources = 1000
http_body_bytes = 33554432
small_http_body_bytes = 65536
input_bytes = 67108864
body_timeout_seconds = 15
identifier_bytes = 128
name_bytes = 512

[authentication]
guest_cookie = "subboost_guest"
administrator_cookie = "subboost_session"
guest_session_seconds = 31536000
administrator_session_seconds = 2592000
minimum_password_characters = 10
maximum_password_bytes = 1024
parallel_logins = 2

[rate_limits]
requests = 600
request_window_seconds = 60
expensive_operations = 30
operation_window_seconds = 60
logins = 8
login_window_seconds = 900
subscription_downloads = 120
download_window_seconds = 60
maximum_clients = 20000

[generation]
rule_base_url = "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo"
test_url = "https://www.gstatic.com/generate_204"
test_interval_seconds = 300

[rules]
page_size = 20
maximum_page_size = 50
maximum_page = 5000
maximum_lines = 100000
maximum_discoveries = 64
parallel_requests = 4
maximum_discovery_bytes = 8388608
