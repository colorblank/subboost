services:
  backend:
    build:
      context: ..
      dockerfile: local/Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://127.0.0.1:3001}
      LOCAL_SETUP_TOKEN: ${LOCAL_SETUP_TOKEN:-}
    volumes:
      - subboost-data:/data
      - ${SUBBOOST_CONFIG_FILE:-../config/subboost.toml}:/etc/subboost/subboost.toml:ro

  app:
    build:
      context: ..
      dockerfile: local/Dockerfile
      target: frontend
      args:
        APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-}
        APP_BUILD_SHA: ${APP_BUILD_SHA:-}
        APP_VERSION: ${APP_VERSION:-}
        APP_VERSION_TOKEN: ${APP_VERSION_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SUBBOOST_BIND_ADDRESS:-127.0.0.1}:${SUBBOOST_PORT:-3001}:3000"
    environment:
      SUBBOOST_BACKEND_URL: http://backend:3002

volumes:
  subboost-data:
