# SubBoost 私有 NAS 专属单容器 Compose 配置（可直接粘贴至群晖 Container Manager / 飞牛 / 绿联 / 极空间 / 1Panel / Portainer）
# 仅需挂载一个 ./data 目录，首次启动会自动释放默认 subboost.toml 配置文件并创建 subboost.sqlite3 数据库。

services:
  subboost:
    image: ${SUBBOOST_AIO_IMAGE:-ghcr.io/subboost/subboost-aio:latest}
    container_name: subboost
    restart: unless-stopped
    ports:
      - "${SUBBOOST_BIND_ADDRESS:-0.0.0.0}:${SUBBOOST_PORT:-3001}:3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_URL: ${APP_URL:-http://127.0.0.1:3001}
      LOCAL_SETUP_TOKEN: ${LOCAL_SETUP_TOKEN:-}
    volumes:
      - ${SUBBOOST_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-3000}/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
